<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>商品圖庫</title>
  <style>
    :root {
      --ink: #1c1917;
      --muted: #6f675f;
      --line: #e4ddd4;
      --paper: #f6f3ee;
      --card: #fff;
      --accent: #9b3bfc;
      --accent-ink: #fff;
      --header-h: 3.1rem;
      --side-w: 16rem;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      flex-direction: column;
      color: var(--ink);
      background: var(--paper);
      font: 15px/1.5 "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      overflow: hidden;
    }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    header {
      flex: 0 0 var(--header-h);
      display: flex;
      gap: 0.75rem;
      align-items: center;
      padding: 0 1rem;
      background: #16162b;
      color: #fff;
    }
    header button.brand {
      margin: 0;
      padding: 0;
      border-radius: 0;
      background: transparent;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 650;
    }
    .crumb-nav {
      min-width: 0;
      color: #d9d3ea;
      font-size: 0.92rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .crumb-nav:empty { display: none; }
    #rescan { margin-left: auto; }
    header button.info {
      position: relative;
      background: transparent;
      color: #fff;
      padding: 0.1rem 0.35rem;
      font-size: 1rem;
      line-height: 1;
    }
    header button.info .tip {
      display: none;
      position: absolute;
      top: calc(100% + 0.45rem);
      right: 0;
      z-index: 20;
      padding: 0.4rem 0.65rem;
      border-radius: 0.4rem;
      background: #fff;
      color: #16162b;
      font-size: 0.82rem;
      line-height: 1.4;
      white-space: nowrap;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
    }
    header button.info:hover .tip,
    header button.info:focus .tip { display: block; }
    header button, .bar button {
      border: 0;
      border-radius: 0.4rem;
      background: #fff;
      color: #16162b;
      padding: 0.35rem 0.7rem;
    }
    header button.ghost { background: transparent; color: #fff; border: 1px solid #4a4568; }
    #workspace {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
    }
    #homeView {
      display: grid;
      grid-template-columns: var(--side-w) minmax(0, 1fr);
      height: 100%;
      min-height: 0;
    }
    #tree {
      min-height: 0;
      overflow: auto;
      border-right: 1px solid var(--line);
      background: #fff;
      padding: 0.55rem 0.35rem;
    }
    .tree-row, .tree-item {
      display: flex;
      width: 100%;
      gap: 0.2rem;
      align-items: center;
      border: 0;
      border-radius: 0.35rem;
      background: transparent;
      color: inherit;
      padding: 0.15rem 0.25rem;
      text-align: left;
    }
    .tree-row.on, .tree-item.on { background: #efe8ff; color: #5b21b6; }
    .tree-row > .tree-cat {
      flex: 1;
      display: flex;
      gap: 0.35rem;
      align-items: center;
      border: 0;
      border-radius: 0.35rem;
      background: transparent;
      color: inherit;
      padding: 0.2rem 0.35rem;
      font-weight: 600;
      text-align: left;
    }
    .tree-item { padding: 0.28rem 0.45rem; }
    .tree-toggle {
      width: 1.2rem;
      border: 0;
      border-radius: 0.3rem;
      background: transparent;
      color: var(--muted);
      padding: 0.2rem 0;
      font-size: 0.75rem;
    }
    .tree-kids { padding-left: 1.1rem; }
    .tree-kids.collapsed { display: none; }
    .tree-icon { color: #c4a574; }
    #homeMain {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    .bar {
      flex: 0 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: center;
      padding: 0.7rem 1rem 0.35rem;
    }
    .bar input[type="search"], .setup input {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 0.4rem;
      padding: 0.4rem 0.6rem;
    }
    .bar input[type="search"] { width: min(22rem, 100%); }
    .stats { margin-left: auto; color: var(--muted); font-size: 0.85rem; }
    .check { display: flex; gap: 0.35rem; align-items: center; color: var(--muted); font-size: 0.85rem; }
    #list {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      padding: 0.5rem 1rem 1.2rem;
    }
    section { margin: 0 0 1.2rem; }
    section h2 {
      margin: 0 0 0.6rem;
      font-size: 1rem;
    }
    .note { margin: -0.35rem 0 0.6rem; color: #9a5b12; font-size: 0.82rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
      gap: 0.75rem;
    }
    .card {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      padding: 0.45rem;
      border: 1px solid var(--line);
      border-radius: 0.6rem;
      background: var(--card);
      text-align: left;
    }
    .card img, .ph {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 0.4rem;
      background: #ece7e0;
    }
    .ph { display: grid; place-items: center; color: var(--muted); font-size: 0.8rem; }
    .card strong { font-size: 0.92rem; }
    .meta { color: var(--muted); font-size: 0.78rem; }
    .badge { color: #9a5b12; }
    #detailView {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: grid;
      grid-template-columns: minmax(16rem, 20rem) minmax(0, 1fr);
      gap: 1rem;
      padding: 0.85rem 1rem 1rem;
      background: var(--paper);
      overflow: hidden;
    }
    .editor {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      min-height: 0;
      overflow: auto;
      padding: 0.75rem 0.85rem;
      border: 1px solid var(--line);
      border-radius: 0.6rem;
      background: #fff;
    }
    .editor .fields {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      flex: 1 1 auto;
    }
    .editor .group {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      padding-bottom: 0.7rem;
      border-bottom: 1px dashed var(--line);
    }
    .editor .group:last-of-type { border-bottom: 0; padding-bottom: 0; }
    .editor label {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .editor .label-text {
      display: flex;
      gap: 0.45rem;
      align-items: baseline;
      color: var(--muted);
      font-size: 0.82rem;
    }
    .editor .label-text .zh { color: var(--ink); font-weight: 600; }
    .editor .label-text .en { color: var(--muted); }
    .editor input, .editor textarea {
      width: 100%;
      margin: 0;
      padding: 0.4rem 0.55rem;
      border: 1px solid var(--line);
      border-radius: 0.4rem;
      background: #fff;
      font: inherit;
    }
    .editor textarea {
      min-height: 4.5rem;
      resize: vertical;
      line-height: 1.5;
    }
    .editor .row { display: flex; gap: 0.6rem; align-items: center; }
    .editor .row button {
      border: 0;
      border-radius: 0.4rem;
      background: var(--accent);
      color: var(--accent-ink);
      padding: 0.4rem 0.9rem;
    }
    .saved { color: #3f6b45; font-size: 0.85rem; }
    .preview-pane {
      min-width: 0;
      min-height: 0;
      overflow: auto;
    }
    .photos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 0.6rem;
    }
    .photos button {
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 0.45rem;
      background: #fff;
      overflow: hidden;
    }
    .photos img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
    .photos span { display: block; padding: 0.25rem 0.4rem 0.4rem; font-size: 0.75rem; color: var(--muted); word-break: break-all; }
    .empty, .setup {
      padding: 1.2rem;
      background: #fff;
      border: 1px dashed var(--line);
      border-radius: 0.6rem;
    }
    .setup {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.55rem;
      margin: 1rem;
    }
    .setup input { width: min(36rem, 100%); }
    .err { color: #9f1239; }
    .lightbox {
      position: relative;
      height: 100%;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 0.6rem;
      background: #16162b;
      color: #fff;
    }
    .lightbox header {
      position: relative;
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex: 0 0 auto;
      padding: 0.55rem 0.75rem;
      background: transparent;
      color: #fff;
    }
    .lightbox header strong { font-size: 0.92rem; }
    .lightbox header .close-preview { margin-left: auto; }
    .lightbox header .count { color: #d9d3ea; font-size: 0.82rem; }
    .zoom-presets {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      gap: 0.2rem;
    }
    .zoom-presets button {
      border: 0;
      border-radius: 0.35rem;
      background: transparent;
      color: #d9d3ea;
      padding: 0.15rem 0.45rem;
      font-size: 0.82rem;
    }
    .zoom-presets button.on { background: #fff; color: #16162b; }
    .lightbox .stage {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }
    .zoom-frame {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
    }
    .zoom-frame.dragging { cursor: grabbing; }
    .zoom-frame img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transform-origin: center center;
      user-select: none;
      -webkit-user-drag: none;
    }
    .nav {
      position: absolute;
      z-index: 2;
      top: 50%;
      transform: translateY(-50%);
      width: 2.4rem;
      height: 2.4rem;
      border: 0;
      border-radius: 999px;
      background: rgba(255,255,255,0.16);
      color: #fff;
      font-size: 1.3rem;
    }
    .nav.prev { left: 0.6rem; }
    .nav.next { right: 0.6rem; }
    .hidden { display: none !important; }
    .modal-mask {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: grid;
      place-items: center;
      padding: 1rem;
      background: rgba(12, 10, 20, 0.45);
    }
    .modal {
      width: min(36rem, 100%);
      max-height: min(80vh, 40rem);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      padding: 1rem 1.1rem 1rem;
      border-radius: 0.6rem;
      background: #fff;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.2);
    }
    .modal h3 {
      margin: 0;
      font-size: 1.05rem;
    }
    .modal p {
      margin: 0;
      color: var(--ink);
      line-height: 1.55;
    }
    .modal .actions {
      display: flex;
      gap: 0.55rem;
      justify-content: flex-end;
    }
    .modal .actions button {
      border: 0;
      border-radius: 0.4rem;
      background: #ece7e0;
      color: var(--ink);
      padding: 0.4rem 0.85rem;
    }
    .modal .actions button.primary {
      background: var(--accent);
      color: var(--accent-ink);
    }
    .modal pre {
      margin: 0;
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      padding: 0.7rem 0.8rem;
      border-radius: 0.45rem;
      background: #f4f1ec;
      color: #2b2622;
      font: 0.82rem/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }
    @media (max-width: 800px) {
      #homeView, #detailView { grid-template-columns: 1fr; }
      #tree { max-height: 38vh; border-right: 0; border-bottom: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <header>
    <button type="button" class="brand" id="home">商品圖庫</button>
    <div class="crumb-nav" id="crumbNav"></div>
    <button type="button" id="rescan">重新掃描</button>
    <button type="button" class="ghost" id="openSetup">設定目錄</button>
    <button type="button" class="info" id="rootInfo" aria-label="商品圖目錄">ℹ️<span class="tip" id="rootTip">正在讀取…</span></button>
  </header>
  <div id="workspace">
    <div id="homeView" class="hidden">
      <aside id="tree"></aside>
      <section id="homeMain">
        <div id="tools" class="bar"></div>
        <div id="list"></div>
      </section>
    </div>
    <div id="detailView" class="hidden"></div>
  </div>
  <script>
    const homeView = document.querySelector('#homeView')
    const detailView = document.querySelector('#detailView')
    const tree = document.querySelector('#tree')
    const tools = document.querySelector('#tools')
    const list = document.querySelector('#list')
    const rootTip = document.querySelector('#rootTip')
    const crumbNav = document.querySelector('#crumbNav')
    let catalog = null
    let query = ''
    let category = ''
    let missingOnly = false
    let selectedKey = ''
    let light = -1
    let indexDraft = null
    let saveNote = ''
    let expanded = new Set()
    let toolsReady = false
    const FIELD_GROUPS = [
      [{ key: '編碼', en: 'Code' }],
      [
        { key: '名稱', en: 'Name' },
        { key: '英文名', en: 'English Name' },
      ],
      [
        { key: '批發價', en: 'Wholesale' },
        { key: '劃線價', en: 'Compare At' },
        { key: '售價', en: 'Price' },
      ],
      [
        { key: '主圖', en: 'Cover' },
        { key: '備註', en: 'Notes', multiline: true },
      ],
    ]
    const FIELD_KEYS = FIELD_GROUPS.flat().map((field) => field.key)

    function el(tag, attrs, kids) {
      const node = document.createElement(tag)
      for (const [key, value] of Object.entries(attrs || {})) {
        if (key === 'class') node.className = value
        else if (key.startsWith('on') && typeof value === 'function') node.addEventListener(key.slice(2), value)
        else if (value != null && value !== false) node.setAttribute(key, String(value))
      }
      for (const kid of kids || []) node.append(kid instanceof Node ? kid : document.createTextNode(String(kid)))
      return node
    }
    function mediaUrl(kind, path, mtime) {
      return `${kind}?path=${encodeURIComponent(path)}&v=${mtime || 0}`
    }
    function allProducts() {
      const rows = []
      for (const cat of catalog?.categories || []) {
        for (const product of cat.products) rows.push(product)
      }
      return rows
    }
    function productKey(product) {
      return `${product.category}/${product.folder}`
    }
    function matchesQuery(product) {
      if (missingOnly && product.has_index) return false
      const words = query.trim().toLowerCase().split(/\s+/).filter(Boolean)
      if (!words.length) return true
      const hay = [
        product.name,
        product.folder,
        product.category,
        ...product.fields.flatMap((field) => [field.key, field.value]),
        ...product.images.map((image) => image.name),
      ].join('\n').toLowerCase()
      return words.every((word) => hay.includes(word))
    }
    function visible(product) {
      if (category && product.category !== category) return false
      return matchesQuery(product)
    }
    function findSelected() {
      return allProducts().find((product) => productKey(product) === selectedKey) || null
    }
    function showingDetail() {
      return Boolean(selectedKey && findSelected())
    }

    function render() {
      if (!catalog) return
      rootTip.textContent = catalog.root
      document.querySelector('.setup')?.remove()
      if (!catalog.root_ok) {
        homeView.classList.add('hidden')
        detailView.classList.add('hidden')
        crumbNav.textContent = ''
        document.querySelector('#workspace').append(setupBox('這個目錄還不存在。請先在電腦上建好文件夾，或改成已有的商品圖目錄。'))
        return
      }
      ensureTools()
      syncCategoryChoice()
      fillTree()
      fillResults()
      homeView.classList.remove('hidden')
      if (showingDetail()) showDetail(findSelected())
      else hideDetail()
    }

    function ensureTools() {
      if (toolsReady) return
      const search = el('input', {
        type: 'search',
        placeholder: '搜尋名稱、屬性、檔名',
        value: query,
        oninput: (event) => {
          query = event.target.value
          fillTree()
          fillResults()
        },
      })
      const box = el('label', { class: 'check' }, [
        el('input', {
          type: 'checkbox',
          onchange: (event) => {
            missingOnly = event.target.checked
            fillTree()
            fillResults()
          },
        }),
        '只看未填 index.txt',
      ])
      if (missingOnly) box.querySelector('input').checked = true
      tools.replaceChildren(search, box, el('span', { id: 'stats', class: 'stats' }, ['']))
      toolsReady = true
    }

    function syncCategoryChoice() {
      const names = catalog.categories.map((cat) => cat.name)
      if (category && !names.includes(category)) category = ''
      if (!expanded.size) {
        for (const name of names) expanded.add(name)
      }
    }

    function setCategory(name) {
      category = name
      if (name) expanded.add(name)
      fillTree()
      fillResults()
    }

    function fillTree() {
      tree.replaceChildren()
      if (!catalog.categories.length) {
        tree.append(el('div', { class: 'empty' }, ['還沒有分類文件夾。']))
        return
      }
      tree.append(el('button', {
        type: 'button',
        class: 'tree-item' + (category ? '' : ' on'),
        onclick: () => setCategory(''),
      }, [
        el('span', { class: 'tree-icon' }, ['📁']),
        '全部',
      ]))
      for (const cat of catalog.categories) {
        const open = expanded.has(cat.name)
        const rows = cat.products.filter(matchesQuery)
        const group = el('div')
        const row = el('div', { class: 'tree-row' + (category === cat.name ? ' on' : '') })
        row.append(
          el('button', {
            type: 'button',
            class: 'tree-toggle',
            onclick: (event) => {
              event.stopPropagation()
              if (expanded.has(cat.name)) expanded.delete(cat.name)
              else expanded.add(cat.name)
              fillTree()
            },
          }, [open ? '▾' : '▸']),
          el('button', {
            type: 'button',
            class: 'tree-cat',
            onclick: () => setCategory(cat.name),
          }, [
            el('span', { class: 'tree-icon' }, ['📁']),
            `${cat.name}（${rows.length}）`,
          ]),
        )
        group.append(row)
        const kids = el('div', { class: 'tree-kids' + (open ? '' : ' collapsed') })
        for (const product of rows) {
          kids.append(el('button', {
            type: 'button',
            class: 'tree-item' + (productKey(product) === selectedKey ? ' on' : ''),
            onclick: () => openProduct(product),
          }, [
            el('span', { class: 'tree-icon' }, ['📂']),
            product.folder,
          ]))
        }
        if (!rows.length) kids.append(el('div', { class: 'note' }, ['沒有符合的商品文件夾。']))
        group.append(kids)
        tree.append(group)
      }
    }

    function fillResults() {
      const products = allProducts().filter(visible)
      const imageCount = products.reduce((sum, product) => sum + product.images.length, 0)
      const stats = document.querySelector('#stats')
      if (stats) stats.textContent = `${products.length} 件商品 · ${imageCount} 張圖`
      list.replaceChildren()
      if (!catalog.categories.length) {
        list.append(el('div', { class: 'empty' }, [
          '目錄是空的。請在這下面先建分類文件夾，再在分類裡為每件商品建一個文件夾，並放入 index.txt 和圖片。',
        ]))
        return
      }
      if (category) {
        const cat = catalog.categories.find((item) => item.name === category)
        const rows = products
        const section = el('section')
        section.append(el('h2', {}, [`${category}（${rows.length}）`]))
        if (cat?.loose_images) {
          section.append(el('p', { class: 'note' }, [
            `有 ${cat.loose_images} 張圖直接放在分類文件夾裡，尚未歸入商品。`,
          ]))
        }
        if (!rows.length) section.append(el('div', { class: 'empty' }, ['這個分類下沒有符合的商品。']))
        else section.append(grid(rows))
        list.append(section)
      } else {
        let shown = 0
        for (const cat of catalog.categories) {
          const rows = cat.products.filter(visible)
          if (!rows.length && (query || missingOnly)) continue
          shown += 1
          const section = el('section')
          section.append(el('h2', {}, [`${cat.name}（${rows.length}）`]))
          if (cat.loose_images) {
            section.append(el('p', { class: 'note' }, [
              `有 ${cat.loose_images} 張圖直接放在分類文件夾裡，尚未歸入商品。`,
            ]))
          }
          if (!rows.length) section.append(el('p', { class: 'note' }, ['這個分類下還沒有商品文件夾。']))
          else section.append(grid(rows))
          list.append(section)
        }
        if (!shown) list.append(el('div', { class: 'empty' }, ['沒有符合的商品。']))
      }
      if (catalog.loose_images) {
        list.append(el('p', { class: 'note' }, [`根目錄另有 ${catalog.loose_images} 張散圖，未計入任何分類。`]))
      }
    }

    function grid(products) {
      return el('div', { class: 'grid' }, products.map((product) => {
        const coverImage = product.images.find((image) => image.path === product.cover)
        const cover = product.cover && !coverImage?.heic
          ? el('img', {
              src: mediaUrl('/thumb', product.cover, coverImage?.mtime),
              alt: product.name,
              loading: 'lazy',
            })
          : el('div', { class: 'ph' }, [coverImage?.heic ? 'HEIC' : '沒有圖片'])
        const bits = [`${product.images.length} 張`]
        if (!product.has_index) bits.push('未填說明')
        return el('button', { class: 'card', type: 'button', onclick: () => openProduct(product) }, [
          cover,
          el('strong', {}, [product.name]),
          el('div', { class: 'meta' + (product.has_index ? '' : ' badge') }, [bits.join(' · ')]),
        ])
      }))
    }

    function openProduct(product) {
      selectedKey = productKey(product)
      light = -1
      indexDraft = null
      saveNote = ''
      if (product.category) {
        category = product.category
        expanded.add(product.category)
      }
      fillTree()
      fillResults()
      showDetail(product)
    }

    function hideDetail() {
      selectedKey = ''
      light = -1
      indexDraft = null
      saveNote = ''
      crumbNav.textContent = ''
      detailView.classList.add('hidden')
      detailView.replaceChildren()
      fillTree()
    }

    function showDetail(product) {
      crumbNav.textContent = `${product.category} / ${product.folder}`
      detailView.classList.remove('hidden')
      detailView.replaceChildren()
      detailView.append(indexEditor(product))
      const pane = el('div', { class: 'preview-pane' })
      if (!product.images.length) {
        pane.append(el('div', { class: 'empty' }, ['這個文件夾裡還沒有圖片。把新照片直接放進來，再按重新掃描。']))
      } else if (light >= 0) {
        pane.append(renderLight(product))
      } else {
        pane.append(el('div', { class: 'photos' }, product.images.map((image, index) => el('button', {
          type: 'button',
          onclick: () => openLight(index),
        }, [
          image.heic
            ? el('div', { class: 'ph' }, ['HEIC'])
            : el('img', { src: mediaUrl('/thumb', image.path, image.mtime), alt: image.name }),
          el('span', {}, [image.heic ? `${image.name}（無法預覽）` : image.name]),
        ]))))
      }
      detailView.append(pane)
    }

    function valuesFromProduct(product) {
      const values = {}
      for (const key of FIELD_KEYS) values[key] = ''
      for (const field of product.fields || []) {
        if (!field.key) continue
        if (values[field.key] == null) values[field.key] = field.value || ''
        else if (!values[field.key] && field.value) values[field.key] = field.value
      }
      return values
    }

    function serializeFields(values) {
      const lines = []
      for (const key of FIELD_KEYS) lines.push(`${key}：${values[key] || ''}`)
      for (const [key, value] of Object.entries(values)) {
        if (FIELD_KEYS.includes(key)) continue
        if (!(value || '').trim()) continue
        lines.push(`${key}：${value}`)
      }
      return lines.join('\n') + '\n'
    }

    function fieldInput(def, values) {
      const input = def.multiline
        ? el('textarea', { spellcheck: 'false', rows: '3' })
        : el('input', { type: 'text', spellcheck: 'false' })
      input.value = values[def.key] || ''
      input.dataset.key = def.key
      input.addEventListener('input', () => {
        if (!indexDraft) indexDraft = { ...values }
        indexDraft[def.key] = input.value
        saveNote = ''
        const hint = document.querySelector('#saveHint')
        if (hint) hint.textContent = ''
      })
      return el('label', {}, [
        el('div', { class: 'label-text' }, [
          el('span', { class: 'zh' }, [def.key]),
          el('span', { class: 'en' }, [def.en]),
        ]),
        input,
      ])
    }

    function indexEditor(product) {
      const hint = el('span', { id: 'saveHint', class: saveNote.startsWith('無法') ? 'err' : 'saved' }, [saveNote])
      const values = indexDraft ? { ...indexDraft } : valuesFromProduct(product)
      const extras = Object.keys(values).filter((key) => !FIELD_KEYS.includes(key))
      const fields = el('div', { class: 'fields' })
      for (const group of FIELD_GROUPS) {
        fields.append(el('div', { class: 'group' }, group.map((def) => fieldInput(def, values))))
      }
      if (extras.length) {
        fields.append(el('div', { class: 'group' }, extras.map((key) => fieldInput({
          key,
          en: 'Custom',
          multiline: key === '備註',
        }, values))))
      }
      const save = async () => {
        const current = {}
        for (const input of fields.querySelectorAll('input, textarea')) {
          current[input.dataset.key] = input.value
        }
        indexDraft = current
        saveNote = ''
        hint.className = 'saved'
        hint.textContent = '正在保存…'
        const response = await fetch('/api/index', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            path: `${product.category}/${product.folder}`,
            text: serializeFields(current),
          }),
        })
        const data = await response.json()
        if (!response.ok) {
          saveNote = data.error || '無法保存'
          hint.className = 'err'
          hint.textContent = saveNote
          return
        }
        catalog = data
        indexDraft = null
        saveNote = '已保存'
        fillTree()
        fillResults()
        const next = findSelected()
        if (next) showDetail(next)
        else hideDetail()
      }
      const form = el('form', { class: 'editor', onsubmit: (event) => { event.preventDefault(); save() } }, [
        fields,
        el('div', { class: 'row' }, [
          el('button', { type: 'submit' }, ['保存']),
          hint,
        ]),
      ])
      form.addEventListener('keydown', (event) => {
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 's') {
          event.preventDefault()
          save()
        }
      })
      return form
    }

    function openLight(index) {
      light = index
      const product = findSelected()
      if (product) showDetail(product)
    }

    function renderLight(product) {
      const image = product.images[light]
      if (!image) return
      const box = el('div', { class: 'lightbox' })
      const close = () => { light = -1; showDetail(product) }
      box.append(el('header', {}, [
        el('strong', {}, [image.name]),
        el('span', { class: 'count' }, [`${light + 1} / ${product.images.length}`]),
        el('button', { class: 'close-preview', type: 'button', onclick: close }, ['關閉']),
      ]))
      const zoomLabel = el('span', { class: 'count' }, [''])
      const stage = el('div', { class: 'stage' })
      if (image.heic) {
        stage.append(el('p', {}, ['這張是 HEIC，瀏覽器無法直接顯示。請安裝 pillow-heif 後重新開啟程式。']))
      } else {
        const img = el('img', { src: mediaUrl('/image', image.path, image.mtime), alt: image.name, draggable: 'false' })
        const frame = el('div', { class: 'zoom-frame' })
        frame.append(img)
        let zoom = 100
        let panX = 0
        let panY = 0
        let accum = 0
        let drag = null
        const presets = [50, 100, 200, 300]
        const presetButtons = presets.map((value) => el('button', {
          type: 'button',
          onclick: () => setScale(value),
        }, [`${value}%`]))
        const presetBar = el('div', { class: 'zoom-presets' }, presetButtons)
        const apply = () => {
          img.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom / 100})`
          zoomLabel.textContent = `${zoom}%`
          presetButtons.forEach((button, index) => button.classList.toggle('on', presets[index] === zoom))
        }
        const setScale = (next) => {
          zoom = next
          panX = 0
          panY = 0
          accum = 0
          apply()
        }
        const zoomAt = (next, clientX, clientY) => {
          next = Math.max(20, Math.min(800, next))
          if (next === zoom) return
          const rect = frame.getBoundingClientRect()
          const cx = clientX - rect.left - rect.width / 2
          const cy = clientY - rect.top - rect.height / 2
          const localX = (cx - panX) / (zoom / 100)
          const localY = (cy - panY) / (zoom / 100)
          zoom = next
          panX = cx - localX * (zoom / 100)
          panY = cy - localY * (zoom / 100)
          apply()
        }
        frame.addEventListener('wheel', (event) => {
          event.preventDefault()
          let steps = 0
          if (event.deltaMode !== 0) steps = event.deltaY > 0 ? -1 : 1
          else {
            accum += event.deltaY
            if (Math.abs(accum) < 80) return
            steps = accum > 0 ? -1 : 1
            accum = 0
          }
          zoomAt(zoom + steps * 20, event.clientX, event.clientY)
        }, { passive: false })
        frame.addEventListener('pointerdown', (event) => {
          if (event.button !== 0) return
          drag = { id: event.pointerId, x: event.clientX, y: event.clientY, panX, panY }
          frame.classList.add('dragging')
          frame.setPointerCapture(event.pointerId)
        })
        frame.addEventListener('pointermove', (event) => {
          if (!drag || event.pointerId !== drag.id) return
          const dx = event.clientX - drag.x
          const dy = event.clientY - drag.y
          panX = drag.panX + dx
          panY = drag.panY + dy
          apply()
        })
        const endDrag = (event) => {
          if (!drag || event.pointerId !== drag.id) return
          drag = null
          frame.classList.remove('dragging')
        }
        frame.addEventListener('pointerup', endDrag)
        frame.addEventListener('pointercancel', endDrag)
        stage.append(frame)
        box.querySelector('header').append(presetBar)
        apply()
      }
      if (product.images.length > 1) {
        stage.append(el('button', { class: 'nav prev', type: 'button', onclick: () => step(-1) }, ['‹']))
        stage.append(el('button', { class: 'nav next', type: 'button', onclick: () => step(1) }, ['›']))
      }
      box.append(stage)
      const head = box.querySelector('header')
      head.insertBefore(zoomLabel, head.querySelector('button'))
      return box
    }

    function step(delta) {
      const product = findSelected()
      if (!product || product.images.length < 2) return
      light = (light + delta + product.images.length) % product.images.length
      showDetail(product)
    }

    function setupBox(message) {
      const input = el('input', { type: 'text', value: catalog.root || '', placeholder: '/Volumes/Data/SisterMart.VIP/products/raw' })
      const hint = el('div', { class: 'err' })
      const save = el('button', { type: 'button', onclick: async () => {
        hint.textContent = ''
        const response = await fetch('/api/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ root: input.value.trim() }),
        })
        const data = await response.json()
        if (!response.ok) {
          hint.textContent = data.error || '無法保存'
          return
        }
        catalog = data
        selectedKey = ''
        render()
      } }, ['使用這個目錄'])
      return el('div', { class: 'setup' }, [el('p', {}, [message]), input, save, hint])
    }

    function closeModal() {
      document.querySelectorAll('.modal-mask').forEach((node) => node.remove())
    }

    function showModal({ title, body, actions }) {
      closeModal()
      const mask = el('div', { class: 'modal-mask' })
      const box = el('div', { class: 'modal' }, [
        el('h3', {}, [title]),
        ...(Array.isArray(body) ? body : [body]),
      ])
      const row = el('div', { class: 'actions' })
      for (const action of actions || []) {
        row.append(el('button', {
          type: 'button',
          class: action.primary ? 'primary' : '',
          onclick: async () => {
            if (action.keepOpen) {
              await action.onclick?.()
              return
            }
            closeModal()
            await action.onclick?.()
          },
        }, [action.label]))
      }
      box.append(row)
      mask.append(box)
      mask.addEventListener('click', (event) => {
        if (event.target === mask) closeModal()
      })
      document.body.append(mask)
      return { mask, box }
    }

    async function askHeicConvert(count, hiddenCount, convertOk) {
      return new Promise((resolve) => {
        const lines = [
          `掃描發現 ${count} 個 HEIC 文件` + (hiddenCount ? `，另有 ${hiddenCount} 個隱藏 HEIC（._ 開頭）。` : '。'),
          '是否轉換成 JPG，並刪除原 HEIC 與隱藏 HEIC？',
        ]
        if (!convertOk) {
          lines.push('目前這個環境無法轉換 HEIC，請在 Mac 上操作，或先安裝 pillow-heif。')
        }
        showModal({
          title: '發現 HEIC 文件',
          body: lines.map((line) => el('p', {}, [line])),
          actions: [
            { label: '稍後處理', onclick: () => resolve(false) },
            {
              label: convertOk ? '轉換並刪除' : '知道了',
              primary: true,
              onclick: () => resolve(Boolean(convertOk)),
            },
          ],
        })
      })
    }

    function showHeicLog(result) {
      const log = el('pre', {}, [(result.logs || []).join('\n')])
      showModal({
        title: result.ok ? 'HEIC 轉換完成' : 'HEIC 轉換完成（有失敗項目）',
        body: [
          el('p', {}, [
            `轉換 ${result.converted || 0}，跳過 ${result.skipped || 0}，刪除 ${result.deleted || 0}` +
            (result.failed ? `，失敗 ${result.failed}` : '') + '。',
          ]),
          log,
        ],
        actions: [{ label: '關閉', primary: true }],
      })
    }

    async function convertHeic() {
      const response = await fetch('/api/heic/convert', { method: 'POST' })
      const data = await response.json()
      if (!response.ok) {
        showModal({
          title: '無法轉換',
          body: [el('p', { class: 'err' }, [data.error || '轉換失敗'])],
          actions: [{ label: '關閉', primary: true }],
        })
        return null
      }
      return data
    }

    async function load() {
      const button = document.querySelector('#rescan')
      button.disabled = true
      try {
        const response = await fetch('/api/catalog')
        if (!response.ok) throw new Error('讀取失敗')
        catalog = await response.json()
      } catch (err) {
        rootTip.textContent = '無法連上本機程式'
        homeView.classList.add('hidden')
        detailView.classList.add('hidden')
        document.querySelector('.setup')?.remove()
        document.querySelector('#workspace').append(el('div', { class: 'setup err' }, ['無法讀取商品目錄，請確認程式仍在運行後按重新掃描。']))
        button.disabled = false
        return
      }
      if (selectedKey && !findSelected()) selectedKey = ''
      render()
      button.disabled = false
      const heicCount = catalog.heic_count || 0
      if (heicCount > 0) {
        const shouldConvert = await askHeicConvert(
          heicCount,
          catalog.heic_hidden_count || 0,
          catalog.heic_convert_ok,
        )
        if (!shouldConvert) return
        button.disabled = true
        try {
          const result = await convertHeic()
          if (result?.catalog) {
            catalog = result.catalog
            if (selectedKey && !findSelected()) selectedKey = ''
            render()
          }
          if (result) showHeicLog(result)
        } finally {
          button.disabled = false
        }
      }
    }

    document.querySelector('#home').onclick = () => {
      hideDetail()
    }
    document.querySelector('#rescan').onclick = load
    document.querySelector('#openSetup').onclick = () => {
      hideDetail()
      homeView.classList.add('hidden')
      document.querySelector('.setup')?.remove()
      document.querySelector('#workspace').append(setupBox('商品圖放在這個目錄。第一層是分類，第二層是每件商品的文件夾。'))
    }
    document.addEventListener('keydown', (event) => {
      if (!showingDetail()) return
      if (event.key === 'Escape') {
        event.preventDefault()
        if (light >= 0) {
          light = -1
          showDetail(findSelected())
        } else {
          hideDetail()
        }
        return
      }
      if (event.target.closest('textarea, input')) return
      if (event.key === 'ArrowRight') { event.preventDefault(); step(1) }
      if (event.key === 'ArrowLeft') { event.preventDefault(); step(-1) }
    })
    load()
  </script>
</body>
</html>
