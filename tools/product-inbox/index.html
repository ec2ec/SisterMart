<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>商品圖庫</title>
  <style>
    :root {
      --ink: #1c1917;
      --muted: #6f675f;
      --line: #e4ddd4;
      --paper: #f6f3ee;
      --card: #fff;
      --accent: #9b3bfc;
      --accent-ink: #fff;
      --header-h: 3.1rem;
      --side-w: 16rem;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      flex-direction: column;
      color: var(--ink);
      background: var(--paper);
      font: 15px/1.5 "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      overflow: hidden;
    }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    header {
      flex: 0 0 var(--header-h);
      display: flex;
      gap: 0.75rem;
      align-items: center;
      padding: 0 1rem;
      background: #16162b;
      color: #fff;
    }
    header button.brand {
      margin: 0;
      padding: 0;
      border-radius: 0;
      background: transparent;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 650;
    }
    .crumb-nav {
      min-width: 0;
      color: #d9d3ea;
      font-size: 0.92rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .crumb-nav:empty { display: none; }
    #rescan { margin-left: auto; }
    header button.info {
      position: relative;
      background: transparent;
      color: #fff;
      padding: 0.1rem 0.35rem;
      font-size: 1rem;
      line-height: 1;
    }
    header button.info .tip {
      display: none;
      position: absolute;
      top: calc(100% + 0.45rem);
      right: 0;
      z-index: 20;
      padding: 0.4rem 0.65rem;
      border-radius: 0.4rem;
      background: #fff;
      color: #16162b;
      font-size: 0.82rem;
      line-height: 1.4;
      white-space: nowrap;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
    }
    header button.info:hover .tip,
    header button.info:focus .tip { display: block; }
    header button, .bar button {
      border: 0;
      border-radius: 0.4rem;
      background: #fff;
      color: #16162b;
      padding: 0.35rem 0.7rem;
    }
    header button.ghost { background: transparent; color: #fff; border: 1px solid #4a4568; }
    #workspace {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
    }
    #homeView {
      display: grid;
      grid-template-columns: var(--side-w) minmax(0, 1fr);
      height: 100%;
      min-height: 0;
    }
    #tree {
      min-height: 0;
      overflow: auto;
      border-right: 1px solid var(--line);
      background: #fff;
      padding: 0.55rem 0.35rem;
    }
    .tree-row, .tree-item {
      display: flex;
      width: 100%;
      gap: 0.2rem;
      align-items: center;
      border: 0;
      border-radius: 0.35rem;
      background: transparent;
      color: inherit;
      padding: 0.15rem 0.25rem;
      text-align: left;
    }
    .tree-row.on, .tree-item.on {
      background: #e4d4ff;
      color: #5b21b6;
    }
    .tree-row > .tree-cat {
      flex: 1;
      display: flex;
      gap: 0.35rem;
      align-items: center;
      border: 0;
      border-radius: 0.35rem;
      background: transparent;
      color: inherit;
      padding: 0.2rem 0.35rem;
      font-weight: 600;
      text-align: left;
    }
    .tree-item { padding: 0.28rem 0.45rem; }
    .tree-item .tree-label {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tree-toggle {
      width: 1.2rem;
      border: 0;
      border-radius: 0.3rem;
      background: transparent;
      color: var(--muted);
      padding: 0.2rem 0;
      font-size: 0.75rem;
    }
    .tree-kids { padding-left: 1.1rem; }
    .tree-kids.collapsed { display: none; }
    .tree-icon { color: #c4a574; }
    .status-dot {
      flex: 0 0 auto;
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 50%;
      margin-left: auto;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.85);
    }
    .cover-wrap {
      position: relative;
      width: 100%;
    }
    .cover-wrap .status-dot {
      position: absolute;
      top: 0.35rem;
      right: 0.35rem;
      margin: 0;
      width: 0.7rem;
      height: 0.7rem;
      z-index: 1;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.95);
    }
    #homeMain {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    .bar {
      flex: 0 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: center;
      padding: 0.7rem 1rem 0.35rem;
    }
    .bar input[type="search"], .setup input {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 0.4rem;
      padding: 0.4rem 0.6rem;
    }
    .bar input[type="search"] { width: min(22rem, 100%); }
    .stats {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .check { display: flex; gap: 0.35rem; align-items: center; color: var(--muted); font-size: 0.85rem; }
    .check:has(#multiPick:checked) {
      background: #a04fe1;
      border-radius: 13px;
      color: #ffffff;
    }
    #list {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      padding: 0.5rem 1rem 1.2rem;
    }
    #list.inbox-mode {
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .inbox-view {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(16rem, 20rem) minmax(0, 1fr);
      gap: 0.85rem;
    }
    .inbox-photos { min-width: 0; min-height: 0; overflow: auto; }
    .inbox-file { color: var(--muted); font-size: 0.75rem; overflow-wrap: anywhere; }
    section { margin: 0 0 1.2rem; }
    .section-head {
      display: block;
      width: 100%;
      margin: 0 0 0.6rem;
      border: 0;
      border-radius: 0.4rem;
      background: transparent;
      padding: 0.35rem 0.5rem;
      font-size: 1rem;
      font-weight: 700;
      text-align: left;
    }
    .section-head.on, .card.on {
      background: #e4d4ff;
      color: #5b21b6;
    }
    .note { margin: -0.35rem 0 0.6rem; color: #9a5b12; font-size: 0.82rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
      gap: 0.75rem;
    }
    .card {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      width: 100%;
      padding: 0.45rem;
      border: 1px solid var(--line);
      border-radius: 0.6rem;
      background: var(--card);
      text-align: left;
    }
    .card.on { border-color: #c4b5fd; }
    .card-wrap { position: relative; min-width: 0; }
    .card-wrap.picked .card { border-color: #9b3bfc; }
    .card-wrap.multi .meta { padding-right: 1.35rem; }
    .tick {
      position: absolute;
      right: 0.4rem;
      bottom: 0.4rem;
      z-index: 1;
      width: 1.05rem;
      height: 1.05rem;
      margin: 0;
      accent-color: #9b3bfc;
    }
    .cover-wrap > img, .cover-wrap > .ph, .card > img, .card > .ph {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 0.4rem;
      background: #ece7e0;
      display: block;
    }
    .ph { display: grid; place-items: center; color: var(--muted); font-size: 0.8rem; }
    .card strong { font-size: 0.92rem; overflow-wrap: anywhere; }
    .card-name {
      margin-top: -0.15rem;
      color: var(--ink);
      font-size: 0.82rem;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }
    .meta { color: var(--muted); font-size: 0.78rem; }
    .badge { color: #9a5b12; }
    #detailView {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: grid;
      grid-template-columns: minmax(16rem, 20rem) minmax(0, 1fr);
      gap: 1rem;
      padding: 0.85rem 1rem 1rem;
      background: var(--paper);
      overflow: hidden;
    }
    .editor {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      min-height: 0;
      overflow: auto;
      padding: 0.75rem 0.85rem;
      border: 1px solid var(--line);
      border-radius: 0.6rem;
      background: #fff;
    }
    .editor .fields {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      flex: 1 1 auto;
    }
    .editor .group {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      padding-bottom: 0.7rem;
      border-bottom: 1px dashed var(--line);
    }
    .editor .group:last-of-type { border-bottom: 0; padding-bottom: 0; }
    .editor label {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .editor .label-text {
      display: flex;
      gap: 0.45rem;
      align-items: baseline;
      color: var(--muted);
      font-size: 0.82rem;
    }
    .editor .label-text .zh { color: var(--ink); font-weight: 600; }
    .editor .label-text .en { color: var(--muted); }
    .editor input, .editor textarea, .editor select {
      width: 100%;
      margin: 0;
      padding: 0.4rem 0.55rem;
      border: 1px solid var(--line);
      border-radius: 0.4rem;
      background: #fff;
      font: inherit;
    }
    .editor textarea {
      min-height: 4.5rem;
      resize: vertical;
      line-height: 1.5;
    }
    .editor .row { display: flex; gap: 0.6rem; align-items: center; }
    .editor .row button {
      border: 0;
      border-radius: 0.4rem;
      background: var(--accent);
      color: var(--accent-ink);
      padding: 0.4rem 0.9rem;
      cursor: pointer;
    }
    .editor .row button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .saved { color: #3f6b45; font-size: 0.85rem; }
    .hint-muted { color: var(--muted); font-size: 0.85rem; }
    .preview-pane {
      min-width: 0;
      min-height: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: auto;
    }
    .photos-block {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      min-height: 0;
    }
    .photos-block .photos-title {
      margin: 0.35rem 0 0;
      padding: 0.15rem 0.1rem;
      font-size: 0.92rem;
      font-weight: 700;
    }
    .photos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 0.6rem;
    }
    .photos button {
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 0.45rem;
      background: #fff;
      overflow: hidden;
    }
    .photos img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
    .photos span { display: block; padding: 0.25rem 0.4rem 0.4rem; font-size: 0.75rem; color: var(--muted); word-break: break-all; }
    .ctx-menu {
      position: fixed;
      z-index: 50;
      min-width: 12rem;
      max-width: min(20rem, calc(100vw - 1rem));
      max-height: min(70vh, 28rem);
      overflow: auto;
      padding: 0.35rem;
      border: 1px solid var(--line);
      border-radius: 0.5rem;
      background: #fff;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.18);
    }
    .ctx-menu.cols {
      display: grid;
      grid-template-columns: minmax(10rem, 14rem) minmax(8.5rem, 10rem);
      gap: 0;
      max-width: min(26rem, calc(100vw - 1rem));
      overflow: hidden;
      padding: 0;
    }
    .ctx-menu.cols .ctx-col {
      min-height: 0;
      max-height: min(70vh, 28rem);
      overflow: auto;
      padding: 0.35rem;
    }
    .ctx-menu.cols .ctx-col + .ctx-col {
      border-left: 1px solid var(--line);
    }
    .ctx-menu .ctx-title {
      padding: 0.35rem 0.55rem 0.45rem;
      color: var(--muted);
      font-size: 0.78rem;
    }
    .ctx-menu .ctx-head {
      padding: 0.35rem 0.55rem 0.15rem;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 650;
    }
    .ctx-menu button {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 0.35rem;
      background: transparent;
      color: inherit;
      padding: 0.4rem 0.55rem;
      text-align: left;
    }
    .ctx-menu button:hover { background: #efe8ff; }
    .ctx-menu button.danger { color: #9f1239; }
    .ctx-menu button.on { background: #efe8ff; font-weight: 650; }
    .ctx-menu button.color-opt {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }
    .ctx-menu button.color-opt .status-dot {
      margin: 0;
      width: 0.7rem;
      height: 0.7rem;
    }
    .ctx-menu hr {
      border: 0;
      border-top: 1px solid var(--line);
      margin: 0.35rem 0.2rem;
    }
    .empty, .setup {
      padding: 1.2rem;
      background: #fff;
      border: 1px dashed var(--line);
      border-radius: 0.6rem;
    }
    .setup {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.55rem;
      margin: 1rem;
    }
    .setup input { width: min(36rem, 100%); }
    .err { color: #9f1239; }
    .lightbox {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 0.6rem;
      background: #16162b;
      color: #fff;
    }
    .lightbox header {
      position: relative;
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex: 0 0 auto;
      padding: 0.55rem 0.75rem;
      background: transparent;
      color: #fff;
    }
    .lightbox header strong { font-size: 0.92rem; }
    .lightbox header .close-preview { margin-left: auto; }
    .lightbox header .count { color: #d9d3ea; font-size: 0.82rem; }
    .zoom-presets {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      gap: 0.2rem;
    }
    .zoom-presets button {
      border: 0;
      border-radius: 0.35rem;
      background: transparent;
      color: #d9d3ea;
      padding: 0.15rem 0.45rem;
      font-size: 0.82rem;
    }
    .zoom-presets button.on { background: #fff; color: #16162b; }
    .zoom-presets button.turn {
      margin-left: 0.15rem;
      padding-inline: 0.35rem;
      font-size: 1rem;
      line-height: 1;
    }
    .lightbox .stage {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }
    .zoom-frame {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
    }
    .zoom-frame.dragging { cursor: grabbing; }
    .zoom-frame img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transform-origin: center center;
      user-select: none;
      -webkit-user-drag: none;
    }
    .nav {
      position: absolute;
      z-index: 2;
      top: 50%;
      transform: translateY(-50%);
      width: 2.4rem;
      height: 2.4rem;
      border: 0;
      border-radius: 999px;
      background: rgba(255,255,255,0.16);
      color: #fff;
      font-size: 1.3rem;
    }
    .nav.prev { left: 0.6rem; }
    .nav.next { right: 0.6rem; }
    .hidden { display: none !important; }
    .modal-mask {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: grid;
      place-items: center;
      padding: 1rem;
      background: rgba(12, 10, 20, 0.45);
    }
    .modal {
      width: min(36rem, 100%);
      max-height: min(80vh, 40rem);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      padding: 1rem 1.1rem 1rem;
      border-radius: 0.6rem;
      background: #fff;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.2);
    }
    .modal h3 {
      margin: 0;
      font-size: 1.05rem;
    }
    .modal p {
      margin: 0;
      color: var(--ink);
      line-height: 1.55;
    }
    .modal .actions {
      display: flex;
      gap: 0.55rem;
      justify-content: flex-end;
    }
    .modal .actions button {
      border: 0;
      border-radius: 0.4rem;
      background: #ece7e0;
      color: var(--ink);
      padding: 0.4rem 0.85rem;
    }
    .modal .actions button.primary {
      background: var(--accent);
      color: var(--accent-ink);
    }
    .modal pre {
      margin: 0;
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      padding: 0.7rem 0.8rem;
      border-radius: 0.45rem;
      background: #f4f1ec;
      color: #2b2622;
      font: 0.82rem/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }
    @media (max-width: 800px) {
      #homeView, #detailView { grid-template-columns: 1fr; }
      #tree { max-height: 38vh; border-right: 0; border-bottom: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <header>
    <button type="button" class="brand" id="home">商品圖庫</button>
    <div class="crumb-nav" id="crumbNav"></div>
    <button type="button" id="rescan">重新掃描</button>
    <button type="button" class="ghost" id="openSetup">設定目錄</button>
    <button type="button" class="info" id="rootInfo" aria-label="商品圖目錄">ℹ️<span class="tip" id="rootTip">正在讀取…</span></button>
  </header>
  <div id="workspace">
    <div id="homeView" class="hidden">
      <aside id="tree"></aside>
      <section id="homeMain">
        <div id="tools" class="bar"></div>
        <div id="list"></div>
      </section>
    </div>
    <div id="detailView" class="hidden"></div>
  </div>
  <script>
    const homeView = document.querySelector('#homeView')
    const detailView = document.querySelector('#detailView')
    const tree = document.querySelector('#tree')
    const tools = document.querySelector('#tools')
    const list = document.querySelector('#list')
    const rootTip = document.querySelector('#rootTip')
    const crumbNav = document.querySelector('#crumbNav')
    let catalog = null
    let query = ''
    let category = ''
    let missingOnly = false
    let selectedKey = ''
    let activeNode = ''
    let light = -1
    let indexDraft = null
    let saveNote = ''
    let expanded = new Set()
    let toolsReady = false
    let multiOn = false
    let picked = new Set()
    let inboxPicked = new Set()
    let inboxDraft = { folder: '', category: '', fields: {} }
    let inboxScroll = 0
    const FIELD_GROUPS = [
      [{ key: '編碼', en: 'Code' }],
      [
        { key: '名稱', en: 'Name' },
        { key: '英文名', en: 'English Name' },
      ],
      [
        { key: '批發價', en: 'Wholesale' },
        { key: '劃線價', en: 'Compare At' },
        { key: '售價', en: 'Price' },
      ],
      [
        { key: '主圖', en: 'Cover' },
        { key: '備註', en: 'Notes', multiline: true },
      ],
    ]
    const FIELD_KEYS = FIELD_GROUPS.flat().map((field) => field.key)
    const STATUS_COLORS = [
      { id: 'red', label: '紅色', hex: '#ef4444' },
      { id: 'orange', label: '橙色', hex: '#f97316' },
      { id: 'yellow', label: '黃色', hex: '#eab308' },
      { id: 'green', label: '綠色', hex: '#22c55e' },
      { id: 'teal', label: '青色', hex: '#14b8a6' },
      { id: 'blue', label: '藍色', hex: '#3b82f6' },
      { id: 'purple', label: '紫色', hex: '#a855f7' },
      { id: 'pink', label: '粉色', hex: '#ec4899' },
      { id: 'brown', label: '棕色', hex: '#a16207' },
      { id: 'gray', label: '灰色', hex: '#6b7280' },
    ]

    function el(tag, attrs, kids) {
      const node = document.createElement(tag)
      for (const [key, value] of Object.entries(attrs || {})) {
        if (key === 'class') node.className = value
        else if (key.startsWith('on') && typeof value === 'function') node.addEventListener(key.slice(2), value)
        else if (value != null && value !== false) node.setAttribute(key, String(value))
      }
      for (const kid of kids || []) node.append(kid instanceof Node ? kid : document.createTextNode(String(kid)))
      return node
    }
    function mediaUrl(kind, path, mtime) {
      return `${kind}?path=${encodeURIComponent(path)}&v=${mtime || 0}`
    }
    function allProducts() {
      const rows = []
      for (const cat of catalog?.categories || []) {
        for (const product of cat.products) rows.push(product)
      }
      return rows
    }
    function productKey(product) {
      return `${product.category}/${product.folder}`
    }
    function folderLabel(product) {
      const code = (product.fields || []).find((field) => field.key === '編碼' && field.value.trim())
      return code ? `${product.folder} - ${code.value.trim()}` : product.folder
    }
    function productName(product) {
      const name = (product.fields || []).find((field) => field.key === '名稱' && field.value.trim())
      return name ? name.value.trim() : ''
    }
    function productImages(product) {
      return product.images || []
    }
    function productOkImages(product) {
      return product.ok_images || []
    }
    function allProductImages(product) {
      return [...productImages(product), ...productOkImages(product)]
    }
    function imageCountLabel(product) {
      const n = productImages(product).length
      if (!product.has_ok_dir) return `${n} 張`
      return `${n} 張 / ${productOkImages(product).length} 張`
    }
    function findCoverImage(product) {
      const all = allProductImages(product)
      return all.find((image) => image.path === product.cover) || null
    }
    function statusColorHex(id) {
      return STATUS_COLORS.find((item) => item.id === id)?.hex || ''
    }
    function statusDot(id) {
      const hex = statusColorHex(id)
      if (!hex) return null
      return el('span', { class: 'status-dot', style: `background:${hex}`, title: STATUS_COLORS.find((item) => item.id === id)?.label || '' })
    }
    function treeProductButton(product) {
      const kids = [
        el('span', { class: 'tree-icon' }, ['📂']),
        el('span', { class: 'tree-label' }, [product.folder]),
      ]
      const dot = statusDot(product.status_color)
      if (dot) kids.push(dot)
      const button = el('button', {
        type: 'button',
        class: 'tree-item' + (activeNode === `item:${productKey(product)}` ? ' on' : ''),
        onclick: () => openProduct(product),
      }, kids)
      if (product.category !== '_待整理_') {
        button.addEventListener('contextmenu', (event) => openFolderMenu(event, product))
      }
      return button
    }
    function matchesQuery(product) {
      if (missingOnly && product.has_index) return false
      const words = query.trim().toLowerCase().split(/\s+/).filter(Boolean)
      if (!words.length) return true
      const hay = [
        product.name,
        product.folder,
        product.category,
        ...product.fields.flatMap((field) => [field.key, field.value]),
        ...product.images.map((image) => image.name),
      ].join('\n').toLowerCase()
      return words.every((word) => hay.includes(word))
    }
    function visible(product) {
      if (category && product.category !== category) return false
      return matchesQuery(product)
    }
    function findSelected() {
      return allProducts().find((product) => productKey(product) === selectedKey) || null
    }
    function showingDetail() {
      return Boolean(selectedKey && findSelected())
    }

    function render() {
      if (!catalog) return
      rootTip.textContent = catalog.root
      document.querySelector('.setup')?.remove()
      if (!catalog.root_ok) {
        homeView.classList.add('hidden')
        detailView.classList.add('hidden')
        crumbNav.textContent = ''
        document.querySelector('#workspace').append(setupBox('這個目錄還不存在。請先在電腦上建好文件夾，或改成已有的商品圖目錄。'))
        return
      }
      ensureTools()
      syncCategoryChoice()
      homeView.classList.remove('hidden')
      if (showingDetail()) {
        paintHome()
        showDetail(findSelected())
      } else hideDetail()
    }

    function ensureTools() {
      if (toolsReady) return
      const search = el('input', {
        type: 'search',
        placeholder: '搜尋名稱、屬性、檔名',
        value: query,
        oninput: (event) => {
          query = event.target.value
          paintHome()
        },
      })
      const box = el('label', { class: 'check' }, [
        el('input', {
          type: 'checkbox',
          onchange: (event) => {
            missingOnly = event.target.checked
            paintHome()
          },
        }),
        '只看未填 index.txt',
      ])
      if (missingOnly) box.querySelector('input').checked = true
      const multi = el('label', { class: 'check' }, [
        el('input', {
          type: 'checkbox',
          id: 'multiPick',
          onchange: (event) => {
            multiOn = event.target.checked
            if (!multiOn) picked.clear()
            paintHome(false)
          },
        }),
        el('span', { id: 'pickLabel' }, ['多選 （已選中 0 個）']),
      ])
      tools.replaceChildren(search, box, el('span', { class: 'stats' }, [
        multi,
        el('span', { id: 'counts' }, ['']),
      ]))
      toolsReady = true
    }

    function syncCategoryChoice() {
      const names = catalog.categories.map((cat) => cat.name)
      if (category && !names.includes(category)) category = ''
      if (!expanded.size) {
        for (const name of names) expanded.add(name)
      }
    }

    function setCategory(name) {
      category = name
      activeNode = name ? `cat:${name}` : ''
      if (name) expanded.add(name)
      paintHome()
    }

    function paintHome(align = true) {
      const treeTop = tree.scrollTop
      const listTop = list.scrollTop
      fillTree()
      fillResults()
      if (align) {
        revealActive()
        return
      }
      const keep = () => {
        tree.scrollTop = treeTop
        list.scrollTop = listTop
      }
      keep()
      requestAnimationFrame(keep)
    }

    function fillTree() {
      tree.replaceChildren()
      if (!catalog.categories.length) {
        tree.append(el('div', { class: 'empty' }, ['還沒有分類文件夾。']))
        return
      }
      tree.append(el('button', {
        type: 'button',
        class: 'tree-item' + (activeNode === '' ? ' on' : ''),
        onclick: () => setCategory(''),
      }, [
        el('span', { class: 'tree-icon' }, ['📁']),
        '全部',
      ]))
      for (const cat of catalog.categories) {
        if (cat.inbox) {
          const images = filteredInbox(cat)
          const rows = (cat.products || []).filter(matchesQuery)
          const open = expanded.has(cat.name)
          const group = el('div')
          const row = el('div', { class: 'tree-row' + (activeNode === `cat:${cat.name}` ? ' on' : '') })
          const toggle = rows.length
            ? el('button', {
                type: 'button',
                class: 'tree-toggle',
                onclick: (event) => {
                  event.stopPropagation()
                  if (expanded.has(cat.name)) expanded.delete(cat.name)
                  else expanded.add(cat.name)
                  fillTree()
                },
              }, [open ? '▾' : '▸'])
            : el('span', { class: 'tree-toggle' }, [''])
          row.append(toggle, el('button', {
            type: 'button',
            class: 'tree-cat',
            onclick: () => setCategory(cat.name),
          }, [`${cat.name}（${rows.length} 夾 · ${images.length} 圖）`]))
          group.append(row)
          if (rows.length) {
            const kids = el('div', { class: 'tree-kids' + (open ? '' : ' collapsed') })
            for (const product of rows) kids.append(treeProductButton(product))
            group.append(kids)
          }
          tree.append(group)
          continue
        }
        const open = expanded.has(cat.name)
        const rows = cat.products.filter(matchesQuery)
        const group = el('div')
        const row = el('div', { class: 'tree-row' + (activeNode === `cat:${cat.name}` ? ' on' : '') })
        row.append(
          el('button', {
            type: 'button',
            class: 'tree-toggle',
            onclick: (event) => {
              event.stopPropagation()
              if (expanded.has(cat.name)) expanded.delete(cat.name)
              else expanded.add(cat.name)
              fillTree()
            },
          }, [open ? '▾' : '▸']),
          el('button', {
            type: 'button',
            class: 'tree-cat',
            onclick: () => setCategory(cat.name),
          }, [
            `${cat.name}（${rows.length}）`,
          ]),
        )
        group.append(row)
        const kids = el('div', { class: 'tree-kids' + (open ? '' : ' collapsed') })
        for (const product of rows) kids.append(treeProductButton(product))
        if (!rows.length) kids.append(el('div', { class: 'note' }, ['沒有符合的商品文件夾。']))
        group.append(kids)
        tree.append(group)
      }
    }

    function filteredInbox(cat) {
      const words = query.trim().toLowerCase().split(/\s+/).filter(Boolean)
      return (cat?.images || []).filter((image) => words.every((word) => image.name.toLowerCase().includes(word)))
    }

    function toggleInbox(image) {
      if (inboxPicked.has(image.path)) inboxPicked.delete(image.path)
      else inboxPicked.add(image.path)
      paintHome(false)
    }

    function inboxValues() {
      const values = {}
      for (const key of FIELD_KEYS) values[key] = inboxDraft.fields[key] || ''
      return values
    }

    function inboxField(def) {
      const input = def.multiline
        ? el('textarea', { spellcheck: 'false', rows: '3' })
        : el('input', { type: 'text', spellcheck: 'false' })
      input.value = inboxDraft.fields[def.key] || ''
      input.addEventListener('input', () => {
        inboxDraft.fields[def.key] = input.value
      })
      return el('label', {}, [
        el('div', { class: 'label-text' }, [
          el('span', { class: 'zh' }, [def.key]),
          el('span', { class: 'en' }, [def.en]),
        ]),
        input,
      ])
    }

    function inboxForm() {
      const canSave = inboxPicked.size > 0
      const hint = el(
        'span',
        { id: 'inboxHint', class: canSave ? 'saved' : 'hint-muted' },
        [canSave ? '' : '請先勾選圖片'],
      )
      const folder = el('input', { type: 'text', spellcheck: 'false', value: inboxDraft.folder })
      folder.addEventListener('input', () => { inboxDraft.folder = folder.value })
      const select = el('select', {}, [
        el('option', { value: '' }, ['請選擇分類']),
        ...catalog.categories.filter((cat) => !cat.inbox).map((cat) => el('option', {
          value: cat.name,
          selected: cat.name === inboxDraft.category,
        }, [cat.name])),
      ])
      select.addEventListener('change', () => { inboxDraft.category = select.value })
      const fields = el('div', { class: 'fields' }, [
        el('div', { class: 'group' }, [
          el('label', {}, [
            el('div', { class: 'label-text' }, [
              el('span', { class: 'zh' }, ['文件夾名']),
              el('span', { class: 'en' }, ['Folder']),
            ]),
            folder,
          ]),
          el('label', {}, [
            el('div', { class: 'label-text' }, [
              el('span', { class: 'zh' }, ['分類']),
              el('span', { class: 'en' }, ['Category']),
            ]),
            select,
          ]),
        ]),
        ...FIELD_GROUPS.map((group) => el('div', { class: 'group' }, group.map((def) => inboxField(def)))),
      ])
      const saveBtn = el('button', { type: 'submit', disabled: !canSave }, ['保存'])
      const save = async () => {
        hint.className = 'err'
        if (!inboxPicked.size) {
          hint.className = 'hint-muted'
          hint.textContent = '請先勾選圖片'
          return
        }
        if (!inboxDraft.folder.trim() || !inboxDraft.category) {
          hint.textContent = '請填寫文件夾名和分類'
          return
        }
        hint.className = 'saved'
        hint.textContent = '正在歸檔…'
        await archiveInbox(false, hint)
      }
      return el('form', { class: 'editor', onsubmit: (event) => { event.preventDefault(); save() } }, [
        fields,
        el('div', { class: 'row' }, [
          saveBtn,
          hint,
        ]),
      ])
    }

    function askConfirm(message) {
      return new Promise((resolve) => {
        let settled = false
        const done = (value) => {
          if (settled) return
          settled = true
          resolve(value)
        }
        const modal = showModal({
          title: '商品文件夾已存在',
          body: [el('p', {}, [message])],
          actions: [
            { label: '取消', onclick: () => done(false) },
            { label: '歸檔至該商品', primary: true, onclick: () => done(true) },
          ],
        })
        modal.mask.addEventListener('click', (event) => {
          if (event.target === modal.mask) done(false)
        })
      })
    }

    async function archiveInbox(merge, hint) {
      const response = await fetch('/api/inbox/archive', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          paths: [...inboxPicked],
          category: inboxDraft.category,
          folder: inboxDraft.folder.trim(),
          text: serializeFields(inboxValues()),
          merge,
        }),
      })
      const data = await response.json()
      if (!response.ok) {
        if (hint) {
          hint.className = 'err'
          hint.textContent = data.error || '無法歸檔'
        }
        return
      }
      if (data.exists && !merge) {
        if (hint) hint.textContent = ''
        const yes = await askConfirm(`「${inboxDraft.category}/${inboxDraft.folder.trim()}」已存在，是否歸檔至該商品？`)
        if (!yes) return
        await archiveInbox(true, hint)
        return
      }
      catalog = data.catalog
      inboxPicked.clear()
      inboxDraft = { folder: '', category: '', fields: {} }
      paintHome(false)
      const lines = (data.moved || []).map((item) => `${item.from.split('/').pop()} → ${item.to}`)
      if (data.failed?.length) {
        for (const item of data.failed) lines.push(`失敗 ${item.path || ''}：${item.error}`)
      }
      const title = data.created ? '已建立商品文件夾' : (data.merged ? '已歸檔至該商品' : '沒有歸檔')
      showModal({
        title,
        body: [
          el('p', {}, [`${data.to || ''}，移入 ${data.moved?.length || 0} 張圖片。`]),
          ...lines.map((line) => el('p', {}, [line])),
        ],
        actions: [{ label: '關閉', primary: true }],
      })
    }

    function renderInbox(cat) {
      const prev = list.querySelector('.inbox-photos')
      if (prev) inboxScroll = prev.scrollTop
      const live = new Set((cat.images || []).map((image) => image.path))
      for (const path of [...inboxPicked]) {
        if (!live.has(path)) inboxPicked.delete(path)
      }
      const images = filteredInbox(cat)
      const folders = (cat.products || []).filter(matchesQuery)
      const counts = document.querySelector('#counts')
      if (counts) counts.textContent = `${folders.length} 個商品文件夾 · ${images.length} 張待整理圖片 · 已選 ${inboxPicked.size} 張`
      const pickLabel = document.querySelector('#pickLabel')
      if (pickLabel) pickLabel.textContent = `多選 （已選中 ${picked.size} 個）`
      list.classList.add('inbox-mode')
      const photos = el('div', { class: 'inbox-photos' })
      if (folders.length) {
        const section = el('section')
        section.append(el('h2', { class: 'section-head' }, [`商品文件夾（${folders.length}）`]))
        section.append(grid(folders))
        photos.append(section)
      }
      if (images.length) {
        const section = el('section')
        section.append(el('h2', { class: 'section-head' }, [`散圖（${images.length}）`]))
        section.append(el('div', { class: 'grid' }, images.map((image) => {
          const chosen = inboxPicked.has(image.path)
          const wrap = el('div', { class: 'card-wrap multi' + (chosen ? ' picked' : '') })
          const button = el('button', {
            class: 'card',
            type: 'button',
            onclick: () => toggleInbox(image),
          }, [
            image.heic
              ? el('div', { class: 'ph' }, ['HEIC'])
              : el('img', { src: mediaUrl('/thumb', image.path, image.mtime), alt: image.name }),
            el('strong', {}, [image.name]),
          ])
          wrap.append(button, el('input', {
            class: 'tick',
            type: 'checkbox',
            checked: chosen,
            onclick: (event) => {
              event.preventDefault()
              event.stopPropagation()
              toggleInbox(image)
            },
          }))
          return wrap
        })))
        photos.append(section)
      }
      if (!folders.length && !images.length) {
        photos.append(el('div', { class: 'empty' }, ['_待整理_裡還沒有圖片或商品文件夾。']))
      }
      const view = el('div', { class: 'inbox-view' })
      view.append(inboxForm())
      view.append(photos)
      list.replaceChildren(view)
      photos.scrollTop = inboxScroll
      photos.addEventListener('scroll', () => { inboxScroll = photos.scrollTop })
    }

    function fillResults() {
      const inbox = (catalog.categories || []).find((cat) => cat.inbox && cat.name === category)
      if (inbox) {
        renderInbox(inbox)
        return
      }
      list.classList.remove('inbox-mode')
      const products = allProducts().filter(visible)
      const imageCount = products.reduce((sum, product) => sum + allProductImages(product).length, 0)
      const counts = document.querySelector('#counts')
      if (counts) counts.textContent = `${products.length} 件商品 · ${imageCount} 張圖`
      const pickLabel = document.querySelector('#pickLabel')
      if (pickLabel) pickLabel.textContent = `多選 （已選中 ${picked.size} 個）`
      list.replaceChildren()
      if (!catalog.categories.length) {
        list.append(el('div', { class: 'empty' }, [
          '目錄是空的。請在這下面先建分類文件夾，再在分類裡為每件商品建一個文件夾，並放入 index.txt 和圖片。',
        ]))
        return
      }
      if (category) {
        const cat = catalog.categories.find((item) => item.name === category)
        const rows = products
        const section = el('section')
        section.append(categoryHeading(category, rows.length))
        if (cat?.loose_images) {
          section.append(el('p', { class: 'note' }, [
            `有 ${cat.loose_images} 張圖直接放在分類文件夾裡，尚未歸入商品。`,
          ]))
        }
        if (!rows.length) section.append(el('div', { class: 'empty' }, ['這個分類下沒有符合的商品。']))
        else section.append(grid(rows))
        list.append(section)
      } else {
        let shown = 0
        for (const cat of catalog.categories) {
          const rows = cat.products.filter(visible)
          if (cat.inbox && !rows.length) continue
          if (!rows.length && (query || missingOnly)) continue
          shown += 1
          const section = el('section')
          section.append(categoryHeading(cat.name, rows.length))
          if (cat.loose_images) {
            section.append(el('p', { class: 'note' }, [
              `有 ${cat.loose_images} 張圖直接放在分類文件夾裡，尚未歸入商品。`,
            ]))
          }
          if (!rows.length) section.append(el('p', { class: 'note' }, ['這個分類下還沒有商品文件夾。']))
          else section.append(grid(rows))
          list.append(section)
        }
        if (!shown) list.append(el('div', { class: 'empty' }, ['沒有符合的商品。']))
      }
      if (catalog.loose_images) {
        list.append(el('p', { class: 'note' }, [`根目錄另有 ${catalog.loose_images} 張散圖，未計入任何分類。`]))
      }
    }

    function categoryHeading(name, count) {
      return el('button', {
        type: 'button',
        class: 'section-head' + (activeNode === `cat:${name}` ? ' on' : ''),
        onclick: () => setCategory(name),
      }, [`${name}（${count}）`])
    }

    function grid(products) {
      return el('div', { class: 'grid' }, products.map((product) => {
        const coverImage = findCoverImage(product)
        const cover = product.cover && !coverImage?.heic
          ? el('img', {
              src: mediaUrl('/thumb', product.cover, coverImage?.mtime),
              alt: folderLabel(product),
              loading: 'lazy',
            })
          : el('div', { class: 'ph' }, [coverImage?.heic ? 'HEIC' : '沒有圖片'])
        const coverWrap = el('div', { class: 'cover-wrap' }, [cover])
        const coverDot = statusDot(product.status_color)
        if (coverDot) coverWrap.append(coverDot)
        const bits = [imageCountLabel(product)]
        if (!product.has_index) bits.push('未填說明')
        const key = productKey(product)
        const on = activeNode === `item:${key}`
        const chosen = picked.has(key)
        const wrap = el('div', {
          class: 'card-wrap' + (multiOn ? ' multi' : '') + (chosen ? ' picked' : ''),
        })
        const lines = [
          coverWrap,
          el('strong', {}, [folderLabel(product)]),
        ]
        const title = productName(product)
        if (title) lines.push(el('div', { class: 'card-name' }, [title]))
        lines.push(el('div', { class: 'meta' + (product.has_index ? '' : ' badge') }, [bits.join(' · ')]))
        const button = el('button', {
          class: 'card' + (on ? ' on' : ''),
          type: 'button',
          onclick: () => {
            if (multiOn) togglePick(product)
            else openProduct(product)
          },
        }, lines)
        wrap.append(button)
        if (multiOn) {
          wrap.append(el('input', {
            class: 'tick',
            type: 'checkbox',
            checked: chosen,
            onclick: (event) => {
              event.preventDefault()
              event.stopPropagation()
              togglePick(product)
            },
          }))
        }
        wrap.addEventListener('contextmenu', (event) => openFolderMenu(event, product))
        return wrap
      }))
    }

    function togglePick(product) {
      const key = productKey(product)
      if (picked.has(key)) picked.delete(key)
      else picked.add(key)
      paintHome(false)
    }

    function scrollPaneTo(pane, node) {
      if (!pane || !node) return
      const paneRect = pane.getBoundingClientRect()
      const nodeRect = node.getBoundingClientRect()
      const delta = (nodeRect.top + nodeRect.height / 2) - (paneRect.top + paneRect.height / 2)
      pane.scrollTop += delta
    }

    function revealActive() {
      scrollPaneTo(tree, tree.querySelector('.tree-row.on, .tree-item.on'))
      scrollPaneTo(list, list.querySelector('.section-head.on, .card.on'))
    }

    function openProduct(product) {
      selectedKey = productKey(product)
      activeNode = `item:${selectedKey}`
      light = -1
      indexDraft = null
      saveNote = ''
      if (product.category) {
        category = product.category
        expanded.add(product.category)
      }
      paintHome()
      showDetail(product)
    }

    function hideDetail() {
      selectedKey = ''
      light = -1
      indexDraft = null
      saveNote = ''
      crumbNav.textContent = ''
      detailView.classList.add('hidden')
      detailView.replaceChildren()
      paintHome()
    }

    function closeContextMenu() {
      document.querySelectorAll('.ctx-menu').forEach((node) => node.remove())
    }

    function placeMenu(menu, clientX, clientY) {
      document.body.append(menu)
      const rect = menu.getBoundingClientRect()
      const x = Math.min(clientX, window.innerWidth - rect.width - 8)
      const y = Math.min(clientY, window.innerHeight - rect.height - 8)
      menu.style.left = `${Math.max(8, x)}px`
      menu.style.top = `${Math.max(8, y)}px`
    }

    async function moveImageTo(image, to) {
      closeContextMenu()
      const response = await fetch('/api/image/move', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path: image.path, to }),
      })
      const data = await response.json()
      if (!response.ok) {
        showModal({
          title: '無法移動',
          body: [el('p', { class: 'err' }, [data.error || '移動失敗'])],
          actions: [{ label: '關閉', primary: true }],
        })
        return
      }
      catalog = data.catalog
      light = -1
      indexDraft = null
      saveNote = ''
      paintHome()
      const next = findSelected()
      if (next) showDetail(next)
      else hideDetail()
    }

    async function moveProductsTo(products, to) {
      closeContextMenu()
      const response = await fetch('/api/product/move', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ paths: products.map(productKey), to }),
      })
      const data = await response.json()
      if (!response.ok) {
        showModal({
          title: '無法移動',
          body: [el('p', { class: 'err' }, [data.error || '移動失敗'])],
          actions: [{ label: '關閉', primary: true }],
        })
        return
      }
      catalog = data.catalog
      picked.clear()
      if (!data.moved.length) {
        paintHome()
        showModal({
          title: '沒有移動',
          body: [el('p', {}, ['這些商品已經在這個分類。'])],
          actions: [{ label: '關閉', primary: true }],
        })
        return
      }
      const destName = data.moved[0].to.split('/')[0]
      expanded.add(destName)
      category = destName
      activeNode = data.moved.length === 1 ? `item:${data.moved[0].to}` : `cat:${destName}`
      paintHome()
      if (data.failed?.length) {
        showModal({
          title: '有商品沒有移走',
          body: data.failed.map((item) => el('p', { class: 'err' }, [`${item.path || '商品'}：${item.error}`])),
          actions: [{ label: '關閉', primary: true }],
        })
      }
    }

    async function setStatusColors(products, color) {
      closeContextMenu()
      const response = await fetch('/api/product/status-color', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ paths: products.map(productKey), color }),
      })
      const data = await response.json()
      if (!response.ok) {
        showModal({
          title: '無法設置狀態色',
          body: [el('p', { class: 'err' }, [data.error || '設置失敗'])],
          actions: [{ label: '關閉', primary: true }],
        })
        return
      }
      catalog = data.catalog
      paintHome(false)
      if (data.failed?.length) {
        showModal({
          title: '有商品沒有設上顏色',
          body: data.failed.map((item) => el('p', { class: 'err' }, [`${item.path || '商品'}：${item.error}`])),
          actions: [{ label: '關閉', primary: true }],
        })
      }
    }

    function openFolderMenu(event, product) {
      event.preventDefault()
      event.stopPropagation()
      closeContextMenu()
      const key = productKey(product)
      const group = multiOn && picked.size > 1 && picked.has(key)
      const products = group
        ? allProducts().filter((item) => picked.has(productKey(item)))
        : [product]
      const colorable = products.filter((item) => item.category !== '_待整理_')
      const moveCol = el('div', { class: 'ctx-col' }, [
        el('div', { class: 'ctx-title' }, [group ? `已選中 ${products.length} 個商品` : `移動${product.folder}`]),
        el('button', {
          type: 'button',
          onclick: () => moveProductsTo(products, '_待整理_'),
        }, ['移到_待整理_']),
        el('hr'),
      ])
      for (const cat of catalog.categories) {
        if (cat.inbox) continue
        if (products.every((item) => item.category === cat.name)) continue
        moveCol.append(el('button', {
          type: 'button',
          onclick: () => moveProductsTo(products, cat.name),
        }, [cat.name]))
      }
      moveCol.append(el('hr'))
      if (!colorable.length) {
        const menu = el('div', { class: 'ctx-menu' }, [moveCol])
        placeMenu(menu, event.clientX, event.clientY)
        return
      }
      const current = colorable.length === 1 ? (colorable[0].status_color || '') : ''
      const colorCol = el('div', { class: 'ctx-col' }, [
        el('div', { class: 'ctx-title' }, ['設置狀態顏色']),
        el('hr'),
      ])
      for (const item of STATUS_COLORS) {
        colorCol.append(el('button', {
          type: 'button',
          class: 'color-opt' + (current === item.id ? ' on' : ''),
          onclick: () => setStatusColors(colorable, item.id),
        }, [
          el('span', { class: 'status-dot', style: `background:${item.hex}` }),
          item.label,
        ]))
      }
      colorCol.append(el('hr'))
      colorCol.append(el('button', {
        type: 'button',
        class: current === '' ? 'on' : '',
        onclick: () => setStatusColors(colorable, ''),
      }, ['清除顏色']))
      const menu = el('div', { class: 'ctx-menu cols' }, [moveCol, colorCol])
      placeMenu(menu, event.clientX, event.clientY)
    }

    function openMoveMenu(event, product, image) {
      event.preventDefault()
      event.stopPropagation()
      if (image?.ok) return
      closeContextMenu()
      const menu = el('div', { class: 'ctx-menu' }, [
        el('div', { class: 'ctx-title' }, [`移動 ${image.name}`]),
        el('button', {
          type: 'button',
          onclick: () => moveImageTo(image, '_待整理_'),
        }, ['移到_待整理_']),
        el('hr'),
      ])
      let targets = 0
      for (const cat of catalog.categories) {
        const rows = cat.products.filter((item) => productKey(item) !== productKey(product))
        if (!rows.length) continue
        menu.append(el('div', { class: 'ctx-head' }, [cat.name]))
        for (const item of rows) {
          targets += 1
          menu.append(el('button', {
            type: 'button',
            onclick: () => moveImageTo(image, productKey(item)),
          }, [item.folder === item.name ? item.folder : `${item.folder}（${item.name}）`]))
        }
      }
      if (!targets) {
        menu.append(el('div', { class: 'ctx-title' }, ['目前沒有其他商品文件夾可選。']))
      }
      placeMenu(menu, event.clientX, event.clientY)
    }

    function photoButton(product, image, index, movable) {
      const button = el('button', {
        type: 'button',
        onclick: () => openLight(index),
      }, [
        image.heic
          ? el('div', { class: 'ph' }, ['HEIC'])
          : el('img', { src: mediaUrl('/thumb', image.path, image.mtime), alt: image.name }),
        el('span', {}, [image.heic ? `${image.name}（無法預覽）` : image.name]),
      ])
      if (movable) {
        button.addEventListener('contextmenu', (event) => openMoveMenu(event, product, image))
      } else {
        button.addEventListener('contextmenu', (event) => {
          event.preventDefault()
          event.stopPropagation()
        })
      }
      return button
    }

    function showDetail(product) {
      closeContextMenu()
      crumbNav.textContent = `${product.category} / ${product.folder}`
      detailView.classList.remove('hidden')
      detailView.replaceChildren()
      detailView.append(indexEditor(product))
      const pane = el('div', { class: 'preview-pane' })
      const rootImages = productImages(product)
      const okImages = productOkImages(product)
      const all = allProductImages(product)
      if (!all.length) {
        pane.append(el('div', { class: 'empty' }, ['這個文件夾裡還沒有圖片。把新照片直接放進來，再按重新掃描。']))
      } else if (light >= 0) {
        pane.append(renderLight(product))
      } else {
        const stack = el('div', { class: 'photos-block' })
        if (rootImages.length) {
          stack.append(el('div', { class: 'photos' }, rootImages.map((image, index) => (
            photoButton(product, image, index, true)
          ))))
        }
        if (product.has_ok_dir) {
          stack.append(el('h2', { class: 'photos-title' }, [`已處理（ok）${okImages.length ? ` · ${okImages.length}` : ''}`]))
          if (okImages.length) {
            stack.append(el('div', { class: 'photos' }, okImages.map((image, index) => (
              photoButton(product, image, rootImages.length + index, false)
            ))))
          } else {
            stack.append(el('div', { class: 'note' }, ['ok 目錄裡還沒有圖片。']))
          }
        }
        pane.append(stack)
      }
      detailView.append(pane)
    }

    function valuesFromProduct(product) {
      const values = {}
      for (const key of FIELD_KEYS) values[key] = ''
      for (const field of product.fields || []) {
        if (!field.key) continue
        if (values[field.key] == null) values[field.key] = field.value || ''
        else if (!values[field.key] && field.value) values[field.key] = field.value
      }
      return values
    }

    function serializeFields(values) {
      const lines = []
      for (const key of FIELD_KEYS) lines.push(`${key}：${values[key] || ''}`)
      for (const [key, value] of Object.entries(values)) {
        if (FIELD_KEYS.includes(key)) continue
        if (!(value || '').trim()) continue
        lines.push(`${key}：${value}`)
      }
      return lines.join('\n') + '\n'
    }

    function fieldInput(def, values) {
      const input = def.multiline
        ? el('textarea', { spellcheck: 'false', rows: '3' })
        : el('input', { type: 'text', spellcheck: 'false' })
      input.value = values[def.key] || ''
      input.dataset.key = def.key
      input.addEventListener('input', () => {
        if (!indexDraft) indexDraft = { ...values }
        indexDraft[def.key] = input.value
        saveNote = ''
        const hint = document.querySelector('#saveHint')
        if (hint) hint.textContent = ''
      })
      return el('label', {}, [
        el('div', { class: 'label-text' }, [
          el('span', { class: 'zh' }, [def.key]),
          el('span', { class: 'en' }, [def.en]),
        ]),
        input,
      ])
    }

    function indexEditor(product) {
      const hint = el('span', { id: 'saveHint', class: saveNote.startsWith('無法') ? 'err' : 'saved' }, [saveNote])
      const values = indexDraft ? { ...indexDraft } : valuesFromProduct(product)
      const extras = Object.keys(values).filter((key) => !FIELD_KEYS.includes(key))
      const fields = el('div', { class: 'fields' })
      for (const group of FIELD_GROUPS) {
        fields.append(el('div', { class: 'group' }, group.map((def) => fieldInput(def, values))))
      }
      if (extras.length) {
        fields.append(el('div', { class: 'group' }, extras.map((key) => fieldInput({
          key,
          en: 'Custom',
          multiline: key === '備註',
        }, values))))
      }
      const save = async () => {
        const current = {}
        for (const input of fields.querySelectorAll('input, textarea')) {
          current[input.dataset.key] = input.value
        }
        indexDraft = current
        saveNote = ''
        hint.className = 'saved'
        hint.textContent = '正在保存…'
        const response = await fetch('/api/index', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            path: `${product.category}/${product.folder}`,
            text: serializeFields(current),
          }),
        })
        const data = await response.json()
        if (!response.ok) {
          saveNote = data.error || '無法保存'
          hint.className = 'err'
          hint.textContent = saveNote
          return
        }
        catalog = data
        indexDraft = null
        saveNote = '已保存'
        paintHome()
        const next = findSelected()
        if (next) showDetail(next)
        else hideDetail()
      }
      const form = el('form', { class: 'editor', onsubmit: (event) => { event.preventDefault(); save() } }, [
        fields,
        el('div', { class: 'row' }, [
          el('button', { type: 'submit' }, ['保存']),
          hint,
        ]),
      ])
      form.addEventListener('keydown', (event) => {
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 's') {
          event.preventDefault()
          save()
        }
      })
      return form
    }

    function openLight(index) {
      light = index
      const product = findSelected()
      if (product) showDetail(product)
    }

    function renderLight(product) {
      const gallery = allProductImages(product)
      const image = gallery[light]
      if (!image) return
      const box = el('div', { class: 'lightbox' })
      const close = () => { light = -1; showDetail(product) }
      const title = image.ok ? `${image.name}（ok）` : image.name
      box.append(el('header', {}, [
        el('strong', {}, [title]),
        el('span', { class: 'count' }, [`${light + 1} / ${gallery.length}`]),
        el('button', { class: 'close-preview', type: 'button', onclick: close }, ['關閉']),
      ]))
      const zoomLabel = el('span', { class: 'count' }, [''])
      const stage = el('div', { class: 'stage' })
      if (image.heic) {
        stage.append(el('p', {}, ['這張是 HEIC，瀏覽器無法直接顯示。請安裝 pillow-heif 後重新開啟程式。']))
      } else {
        const img = el('img', { src: mediaUrl('/image', image.path, image.mtime), alt: image.name, draggable: 'false' })
        const frame = el('div', { class: 'zoom-frame' })
        frame.append(img)
        let zoom = 100
        let panX = 0
        let panY = 0
        let rotation = 0
        let accum = 0
        let drag = null
        const presets = [50, 100, 200, 300]
        const presetButtons = presets.map((value) => el('button', {
          type: 'button',
          onclick: () => setScale(value),
        }, [`${value}%`]))
        const rotateBy = (delta) => {
          rotation = (rotation + delta + 360) % 360
          apply()
        }
        const turnButtons = [
          el('button', { class: 'turn', type: 'button', title: '逆時針旋轉', onclick: () => rotateBy(-90) }, ['⤵️']),
          el('button', { class: 'turn', type: 'button', title: '順時針旋轉', onclick: () => rotateBy(90) }, ['⤴️']),
        ]
        const presetBar = el('div', { class: 'zoom-presets' }, [...presetButtons, ...turnButtons])
        const spin = (x, y, deg) => {
          const rad = deg * Math.PI / 180
          const c = Math.cos(rad)
          const s = Math.sin(rad)
          return [c * x - s * y, s * x + c * y]
        }
        const apply = () => {
          img.style.transform = `translate(${panX}px, ${panY}px) rotate(${rotation}deg) scale(${zoom / 100})`
          zoomLabel.textContent = `${zoom}%`
          presetButtons.forEach((button, index) => button.classList.toggle('on', presets[index] === zoom))
        }
        const setScale = (next) => {
          zoom = next
          panX = 0
          panY = 0
          accum = 0
          apply()
        }
        const zoomAt = (next, clientX, clientY) => {
          next = Math.max(20, Math.min(800, next))
          if (next === zoom) return
          const rect = frame.getBoundingClientRect()
          const cx = clientX - rect.left - rect.width / 2
          const cy = clientY - rect.top - rect.height / 2
          const [ux, uy] = spin(cx - panX, cy - panY, -rotation)
          const localX = ux / (zoom / 100)
          const localY = uy / (zoom / 100)
          zoom = next
          const [rx, ry] = spin(localX * (zoom / 100), localY * (zoom / 100), rotation)
          panX = cx - rx
          panY = cy - ry
          apply()
        }
        frame.addEventListener('wheel', (event) => {
          event.preventDefault()
          let steps = 0
          if (event.deltaMode !== 0) steps = event.deltaY > 0 ? -1 : 1
          else {
            accum += event.deltaY
            if (Math.abs(accum) < 80) return
            steps = accum > 0 ? -1 : 1
            accum = 0
          }
          zoomAt(zoom + steps * 20, event.clientX, event.clientY)
        }, { passive: false })
        frame.addEventListener('pointerdown', (event) => {
          if (event.button !== 0) return
          drag = { id: event.pointerId, x: event.clientX, y: event.clientY, panX, panY }
          frame.classList.add('dragging')
          frame.setPointerCapture(event.pointerId)
        })
        frame.addEventListener('pointermove', (event) => {
          if (!drag || event.pointerId !== drag.id) return
          const dx = event.clientX - drag.x
          const dy = event.clientY - drag.y
          panX = drag.panX + dx
          panY = drag.panY + dy
          apply()
        })
        const endDrag = (event) => {
          if (!drag || event.pointerId !== drag.id) return
          drag = null
          frame.classList.remove('dragging')
        }
        frame.addEventListener('pointerup', endDrag)
        frame.addEventListener('pointercancel', endDrag)
        stage.append(frame)
        box.querySelector('header').append(presetBar)
        apply()
        if (image.ok) {
          frame.addEventListener('contextmenu', (event) => {
            event.preventDefault()
            event.stopPropagation()
          })
        } else {
          frame.addEventListener('contextmenu', (event) => openMoveMenu(event, product, image))
        }
      }
      if (gallery.length > 1) {
        stage.append(el('button', { class: 'nav prev', type: 'button', onclick: () => step(-1) }, ['‹']))
        stage.append(el('button', { class: 'nav next', type: 'button', onclick: () => step(1) }, ['›']))
      }
      box.append(stage)
      const head = box.querySelector('header')
      head.insertBefore(zoomLabel, head.querySelector('button'))
      return box
    }

    function step(delta) {
      const product = findSelected()
      const gallery = product ? allProductImages(product) : []
      if (!product || gallery.length < 2) return
      light = (light + delta + gallery.length) % gallery.length
      showDetail(product)
    }

    function setupBox(message) {
      const input = el('input', { type: 'text', value: catalog.root || '', placeholder: '/Volumes/Data/SisterMart.VIP/products/raw' })
      const hint = el('div', { class: 'err' })
      const save = el('button', { type: 'button', onclick: async () => {
        hint.textContent = ''
        const response = await fetch('/api/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ root: input.value.trim() }),
        })
        const data = await response.json()
        if (!response.ok) {
          hint.textContent = data.error || '無法保存'
          return
        }
        catalog = data
        selectedKey = ''
        render()
      } }, ['使用這個目錄'])
      return el('div', { class: 'setup' }, [el('p', {}, [message]), input, save, hint])
    }

    function closeModal() {
      document.querySelectorAll('.modal-mask').forEach((node) => node.remove())
    }

    function showModal({ title, body, actions }) {
      closeModal()
      const mask = el('div', { class: 'modal-mask' })
      const box = el('div', { class: 'modal' }, [
        el('h3', {}, [title]),
        ...(Array.isArray(body) ? body : [body]),
      ])
      const row = el('div', { class: 'actions' })
      for (const action of actions || []) {
        row.append(el('button', {
          type: 'button',
          class: action.primary ? 'primary' : '',
          onclick: async () => {
            if (action.keepOpen) {
              await action.onclick?.()
              return
            }
            closeModal()
            await action.onclick?.()
          },
        }, [action.label]))
      }
      box.append(row)
      mask.append(box)
      mask.addEventListener('click', (event) => {
        if (event.target === mask) closeModal()
      })
      document.body.append(mask)
      return { mask, box }
    }

    async function askHeicConvert(count, hiddenCount, convertOk) {
      return new Promise((resolve) => {
        const lines = [
          `掃描發現 ${count} 個 HEIC 文件` + (hiddenCount ? `，另有 ${hiddenCount} 個隱藏 HEIC（._ 開頭）。` : '。'),
          '是否轉換成 JPG，並刪除原 HEIC 與隱藏 HEIC？',
        ]
        if (!convertOk) {
          lines.push('目前這個環境無法轉換 HEIC，請在 Mac 上操作，或先安裝 pillow-heif。')
        }
        showModal({
          title: '發現 HEIC 文件',
          body: lines.map((line) => el('p', {}, [line])),
          actions: [
            { label: '稍後處理', onclick: () => resolve(false) },
            {
              label: convertOk ? '轉換並刪除' : '知道了',
              primary: true,
              onclick: () => resolve(Boolean(convertOk)),
            },
          ],
        })
      })
    }

    function showHeicLog(result) {
      const log = el('pre', {}, [(result.logs || []).join('\n')])
      showModal({
        title: result.ok ? 'HEIC 轉換完成' : 'HEIC 轉換完成（有失敗項目）',
        body: [
          el('p', {}, [
            `轉換 ${result.converted || 0}，跳過 ${result.skipped || 0}，刪除 ${result.deleted || 0}` +
            (result.failed ? `，失敗 ${result.failed}` : '') + '。',
          ]),
          log,
        ],
        actions: [{ label: '關閉', primary: true }],
      })
    }

    async function convertHeic() {
      const response = await fetch('/api/heic/convert', { method: 'POST' })
      const data = await response.json()
      if (!response.ok) {
        showModal({
          title: '無法轉換',
          body: [el('p', { class: 'err' }, [data.error || '轉換失敗'])],
          actions: [{ label: '關閉', primary: true }],
        })
        return null
      }
      return data
    }

    async function load() {
      const button = document.querySelector('#rescan')
      button.disabled = true
      try {
        const response = await fetch('/api/catalog')
        if (!response.ok) throw new Error('讀取失敗')
        catalog = await response.json()
      } catch (err) {
        rootTip.textContent = '無法連上本機程式'
        homeView.classList.add('hidden')
        detailView.classList.add('hidden')
        document.querySelector('.setup')?.remove()
        document.querySelector('#workspace').append(el('div', { class: 'setup err' }, ['無法讀取商品目錄，請確認程式仍在運行後按重新掃描。']))
        button.disabled = false
        return
      }
      if (selectedKey && !findSelected()) selectedKey = ''
      render()
      button.disabled = false
      const heicCount = catalog.heic_count || 0
      if (heicCount > 0) {
        const shouldConvert = await askHeicConvert(
          heicCount,
          catalog.heic_hidden_count || 0,
          catalog.heic_convert_ok,
        )
        if (!shouldConvert) return
        button.disabled = true
        try {
          const result = await convertHeic()
          if (result?.catalog) {
            catalog = result.catalog
            if (selectedKey && !findSelected()) selectedKey = ''
            render()
          }
          if (result) showHeicLog(result)
        } finally {
          button.disabled = false
        }
      }
    }

    document.querySelector('#home').onclick = () => {
      closeContextMenu()
      hideDetail()
    }
    document.querySelector('#rescan').onclick = load
    document.querySelector('#openSetup').onclick = () => {
      closeContextMenu()
      hideDetail()
      homeView.classList.add('hidden')
      document.querySelector('.setup')?.remove()
      document.querySelector('#workspace').append(setupBox('商品圖放在這個目錄。第一層是分類，第二層是每件商品的文件夾。'))
    }
    document.addEventListener('pointerdown', (event) => {
      if (!event.target.closest('.ctx-menu')) closeContextMenu()
    })
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && document.querySelector('.ctx-menu')) {
        event.preventDefault()
        closeContextMenu()
        return
      }
      if (!showingDetail()) return
      if (event.key === 'Escape') {
        event.preventDefault()
        if (light >= 0) {
          light = -1
          showDetail(findSelected())
        } else {
          hideDetail()
        }
        return
      }
      if (event.target.closest('textarea, input')) return
      if (event.key === 'ArrowRight') { event.preventDefault(); step(1) }
      if (event.key === 'ArrowLeft') { event.preventDefault(); step(-1) }
    })
    load()
  </script>
</body>
</html>
