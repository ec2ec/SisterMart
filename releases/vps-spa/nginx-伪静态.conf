# 貼到主機面板「偽靜態 / 網站 Nginx 配置」— SisterMart H5 + Admin
# 遠程錯誤頁已確認為 nginx，僅上傳 .htaccess 通常無效，必須加这段。

location /api/ {
    # 保持現有 pathinfo 入口，勿改寫掉
}

location /mock/ {
    try_files $uri =404;
}

location /assets/ {
    try_files $uri =404;
}

location /admin/ {
    try_files $uri $uri/ /admin/index.html;
}

location / {
    try_files $uri $uri/ /index.html;
}
