name: m1-ci

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            apps/h5/pnpm-lock.yaml
            apps/admin/pnpm-lock.yaml
      - name: Install & build H5
        working-directory: apps/h5
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Install & build Admin
        working-directory: apps/admin
        run: pnpm install --frozen-lockfile && pnpm build

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, mysql, xml, curl, zip
      - name: Composer install
        working-directory: apps/api
        run: composer install --no-interaction --prefer-dist
      - name: PHP syntax check (health)
        working-directory: apps/api
        run: php -l app/controller/Health.php
